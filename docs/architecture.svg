<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 980" width="100%" height="100%" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="header-shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="impl-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Top Title Banner -->
  <rect x="30" y="25" width="1260" height="90" rx="12" fill="url(#header-grad)" filter="url(#header-shadow)" />
  <text x="60" y="62" fill="#FFFFFF" font-size="24" font-weight="700" letter-spacing="-0.3">FinWise Lending — System Architecture Design</text>
  <text x="60" y="90" fill="#94A3B8" font-size="14" font-weight="400">End-to-End Pipeline: Ingestion &bull; Quality Checks &bull; XGBoost (Gini &ge; 0.45) &bull; SHAP Waterfall &bull; FastAPI (50 Concurrency) &bull; React UI</text>

  <!-- Status Legend -->
  <g transform="translate(860, 50)">
    <rect x="0" y="0" width="180" height="38" rx="6" fill="#065F46" />
    <circle cx="18" cy="19" r="6" fill="#34D399" />
    <text x="32" y="24" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">WEEK 1 IMPLEMENTED</text>

    <rect x="195" y="0" width="205" height="38" rx="6" fill="#1E3A8A" />
    <circle cx="213" cy="19" r="6" fill="#60A5FA" />
    <text x="227" y="24" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">PLANNED (WEEKS 3–12)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. DATA INGESTION & QUALITY VALIDATION (IMPLEMENTED)                      -->
  <!-- ========================================================================= -->
  <rect x="30" y="145" width="1260" height="135" rx="12" fill="url(#impl-grad)" stroke="#059669" stroke-width="2.5" filter="url(#card-shadow)" />
  
  <rect x="50" y="130" width="360" height="26" rx="6" fill="#059669" />
  <text x="60" y="148" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">STAGE 1: DATA INGESTION &amp; QUALITY</text>
  <rect x="330" y="130" width="135" height="26" rx="6" fill="#047857" />
  <text x="338" y="148" fill="#A7F3D0" font-size="11" font-weight="700">WEEK 1 COMPLETED</text>

  <!-- Step 1A -->
  <g transform="translate(60, 175)">
    <rect width="250" height="85" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="20" y="30" fill="#065F46" font-size="14" font-weight="700">Client CSV Ingestion</text>
    <text x="20" y="52" fill="#334155" font-size="12">Module: <tspan font-family="monospace" fill="#047857">load_csv()</tspan></text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; Verifies path &amp; blocks 0-bytes</text>
  </g>

  <!-- Arrow 1A -> 1B -->
  <line x1="310" y1="217" x2="350" y2="217" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- Step 1B -->
  <g transform="translate(360, 175)">
    <rect width="280" height="85" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="20" y="30" fill="#065F46" font-size="14" font-weight="700">Defensive Validation</text>
    <text x="20" y="52" fill="#334155" font-size="12">Format &amp; Error Guards</text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; Rejects directories &amp; bad syntax</text>
  </g>

  <!-- Arrow 1B -> 1C -->
  <line x1="640" y1="217" x2="680" y2="217" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- Step 1C -->
  <g transform="translate(690, 175)">
    <rect width="300" height="85" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="20" y="30" fill="#065F46" font-size="14" font-weight="700">Data-Quality Profiler</text>
    <text x="20" y="52" fill="#334155" font-size="12">Func: <tspan font-family="monospace" fill="#047857">generate_data_quality_summary()</tspan></text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; Rows, cols, dtypes, nulls, duplicates</text>
  </g>

  <!-- Arrow 1C -> 1D -->
  <line x1="990" y1="217" x2="1030" y2="217" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- Step 1D -->
  <g transform="translate(1040, 175)">
    <rect width="220" height="85" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="20" y="30" fill="#065F46" font-size="14" font-weight="700">Zero-Loss Guarantee</text>
    <text x="20" y="52" fill="#334155" font-size="12">Non-Destructive Profiling</text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; 0 dropped rows / cols</text>
  </g>


  <!-- Flow Arrow Stage 1 -> Stage 2 -->
  <path d="M 660 280 L 660 305" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)" />


  <!-- ========================================================================= -->
  <!-- 2. EXPLORATION, PREPROCESSING & LEAKAGE CHECKS (PLANNED - WEEK 3)         -->
  <!-- ========================================================================= -->
  <rect x="30" y="315" width="1260" height="135" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#card-shadow)" />

  <rect x="50" y="300" width="370" height="26" rx="6" fill="#3B82F6" />
  <text x="60" y="318" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">STAGE 2: PREPROCESSING &amp; LEAKAGE AUDIT</text>
  <rect x="330" y="300" width="135" height="26" rx="6" fill="#1D4ED8" />
  <text x="338" y="318" fill="#BFDBFE" font-size="11" font-weight="700">WEEK 3 PLANNED</text>

  <!-- Step 2A -->
  <g transform="translate(60, 345)">
    <rect width="250" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="20" y="30" fill="#1E293B" font-size="14" font-weight="700">Target Confirmation</text>
    <text x="20" y="52" fill="#475569" font-size="12">Domain Ground-Truth</text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; Audit loan_status vs default</text>
  </g>

  <!-- Arrow 2A -> 2B -->
  <line x1="310" y1="387" x2="350" y2="387" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 2B -->
  <g transform="translate(360, 345)">
    <rect width="280" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="20" y="30" fill="#1E293B" font-size="14" font-weight="700">Post-Origination Filter</text>
    <text x="20" y="52" fill="#475569" font-size="12">Data Leakage Elimination</text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; Exclude post-approval fields</text>
  </g>

  <!-- Arrow 2B -> 2C -->
  <line x1="640" y1="387" x2="680" y2="387" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 2C -->
  <g transform="translate(690, 345)">
    <rect width="300" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="20" y="30" fill="#1E293B" font-size="14" font-weight="700">Feature Engineering</text>
    <text x="20" y="52" fill="#475569" font-size="12">Underwriting Ratios</text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; DTI, utilization, out-of-fold encoders</text>
  </g>

  <!-- Arrow 2C -> 2D -->
  <line x1="990" y1="387" x2="1030" y2="387" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 2D -->
  <g transform="translate(1040, 345)">
    <rect width="220" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="20" y="30" fill="#1E293B" font-size="14" font-weight="700">Data Splitting</text>
    <text x="20" y="52" fill="#475569" font-size="12">Train / Val / Test (Holdout)</text>
    <text x="20" y="70" fill="#64748B" font-size="11">&bull; Strict stratification</text>
  </g>


  <!-- Flow Arrow Stage 2 -> Stage 3 -->
  <path d="M 660 450 L 660 475" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)" />


  <!-- ========================================================================= -->
  <!-- 3. MODEL TRAINING, EVALUATION & EXPLAINABILITY (PLANNED - WEEKS 3 & 6)     -->
  <!-- ========================================================================= -->
  <rect x="30" y="485" width="1260" height="155" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#card-shadow)" />

  <rect x="50" y="470" width="370" height="26" rx="6" fill="#3B82F6" />
  <text x="60" y="488" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">STAGE 3: MODELING, SHAP &amp; RISK BANDS</text>
  <rect x="330" y="470" width="135" height="26" rx="6" fill="#1D4ED8" />
  <text x="338" y="488" fill="#BFDBFE" font-size="11" font-weight="700">WEEKS 3 &amp; 6 PLANNED</text>

  <!-- Step 3A -->
  <g transform="translate(60, 515)">
    <rect width="220" height="105" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="18" y="28" fill="#1E293B" font-size="14" font-weight="700">Logistic Baseline</text>
    <text x="18" y="48" fill="#475569" font-size="12">Benchmark Model</text>
    <text x="18" y="70" fill="#64748B" font-size="11">&bull; Baseline Gini &amp; AUC</text>
    <text x="18" y="88" fill="#64748B" font-size="11">&bull; Linear reference</text>
  </g>

  <!-- Arrow 3A -> 3B -->
  <line x1="280" y1="567" x2="310" y2="567" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 3B -->
  <g transform="translate(320, 515)">
    <rect width="260" height="105" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="18" y="28" fill="#1E3A8A" font-size="14" font-weight="700">XGBoost Classifier</text>
    <text x="18" y="48" fill="#2563EB" font-size="12" font-weight="700">Target: Test Gini &ge; 0.45</text>
    <text x="18" y="70" fill="#475569" font-size="11">&bull; Equivalent: ROC-AUC &ge; 0.725</text>
    <text x="18" y="88" fill="#475569" font-size="11">&bull; Regularized 2nd-order loss</text>
  </g>

  <!-- Arrow 3B -> 3C -->
  <line x1="580" y1="567" x2="610" y2="567" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 3C -->
  <g transform="translate(620, 515)">
    <rect width="210" height="105" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="16" y="28" fill="#1E293B" font-size="14" font-weight="700">Probability Calibration</text>
    <text x="16" y="48" fill="#475569" font-size="12">Brier Score &amp; Reliability</text>
    <text x="16" y="70" fill="#64748B" font-size="11">&bull; True posterior PD</text>
    <text x="16" y="88" fill="#64748B" font-size="11">&bull; Platt / Isotonic scaling</text>
  </g>

  <!-- Arrow 3C -> 3D -->
  <line x1="830" y1="567" x2="860" y2="567" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 3D -->
  <g transform="translate(870, 515)">
    <rect width="200" height="105" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="16" y="28" fill="#1E293B" font-size="14" font-weight="700">Risk Classification</text>
    <text x="16" y="48" fill="#475569" font-size="12" font-weight="700">Low / Med / High</text>
    <text x="16" y="70" fill="#64748B" font-size="11">&bull; Client policy-driven</text>
    <text x="16" y="88" fill="#64748B" font-size="11">&bull; No arbitrary thresholds</text>
  </g>

  <!-- Arrow 3D -> 3E -->
  <line x1="1070" y1="567" x2="1090" y2="567" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 3E -->
  <g transform="translate(1095, 515)">
    <rect width="180" height="105" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
    <text x="14" y="28" fill="#92400E" font-size="13" font-weight="700">SHAP &amp; Fairness</text>
    <text x="14" y="48" fill="#B45309" font-size="11" font-weight="700">Waterfall Chart/Pred</text>
    <text x="14" y="70" fill="#78350F" font-size="11">&bull; TreeSHAP attribution</text>
    <text x="14" y="88" fill="#78350F" font-size="11">&bull; Gender &amp; Age Audits</text>
  </g>


  <!-- Flow Arrow Stage 3 -> Stage 4 -->
  <path d="M 660 640 L 660 665" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)" />


  <!-- ========================================================================= -->
  <!-- 4. FASTAPI SERVING LAYER (PLANNED - WEEK 9)                               -->
  <!-- ========================================================================= -->
  <rect x="30" y="675" width="1260" height="125" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#card-shadow)" />

  <rect x="50" y="660" width="370" height="26" rx="6" fill="#3B82F6" />
  <text x="60" y="678" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">STAGE 4: FASTAPI SERVING LAYER</text>
  <rect x="330" y="660" width="135" height="26" rx="6" fill="#1D4ED8" />
  <text x="338" y="678" fill="#BFDBFE" font-size="11" font-weight="700">WEEK 9 PLANNED</text>

  <!-- Step 4A -->
  <g transform="translate(60, 705)">
    <rect width="360" height="75" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="18" y="28" fill="#1E293B" font-size="14" font-weight="700">High-Concurrency API</text>
    <text x="18" y="48" fill="#2563EB" font-size="12" font-weight="700">Target: 50 Concurrent Requests</text>
    <text x="18" y="65" fill="#64748B" font-size="11">&bull; Asynchronous non-blocking worker architecture</text>
  </g>

  <!-- Arrow 4A -> 4B -->
  <line x1="420" y1="742" x2="470" y2="742" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 4B -->
  <g transform="translate(485, 705)">
    <rect width="360" height="75" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="18" y="28" fill="#1E293B" font-size="14" font-weight="700">Request Validation</text>
    <text x="18" y="48" fill="#475569" font-size="12">Pydantic Schemas</text>
    <text x="18" y="65" fill="#64748B" font-size="11">&bull; Type enforcement &amp; boundary checks</text>
  </g>

  <!-- Arrow 4B -> 4C -->
  <line x1="845" y1="742" x2="895" y2="742" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 4C -->
  <g transform="translate(910, 705)">
    <rect width="350" height="75" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="18" y="28" fill="#1E293B" font-size="14" font-weight="700">Endpoints</text>
    <text x="18" y="48" fill="#475569" font-size="12"><tspan font-family="monospace">GET /health</tspan> &bull; <tspan font-family="monospace">POST /predict</tspan> &bull; <tspan font-family="monospace">POST /explain</tspan></text>
    <text x="18" y="65" fill="#64748B" font-size="11">&bull; Low/Med/High output &amp; Waterfall JSON</text>
  </g>


  <!-- Flow Arrow Stage 4 -> Stage 5 -->
  <path d="M 660 800 L 660 825" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)" />


  <!-- ========================================================================= -->
  <!-- 5. REACT DASHBOARD (PLANNED - WEEK 12)                                    -->
  <!-- ========================================================================= -->
  <rect x="30" y="835" width="1260" height="115" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#card-shadow)" />

  <rect x="50" y="820" width="370" height="26" rx="6" fill="#3B82F6" />
  <text x="60" y="838" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">STAGE 5: REACT LOAN OFFICER DASHBOARD</text>
  <rect x="330" y="820" width="135" height="26" rx="6" fill="#1D4ED8" />
  <text x="338" y="838" fill="#BFDBFE" font-size="11" font-weight="700">WEEK 12 PLANNED</text>

  <!-- Step 5A -->
  <g transform="translate(60, 860)">
    <rect width="360" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="18" y="28" fill="#1E293B" font-size="14" font-weight="700">Underwriter Portal</text>
    <text x="18" y="48" fill="#475569" font-size="12">Decision Support System</text>
    <text x="18" y="62" fill="#64748B" font-size="11">&bull; Human-in-the-loop (no auto-decline)</text>
  </g>

  <!-- Arrow 5A -> 5B -->
  <line x1="420" y1="895" x2="470" y2="895" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 5B -->
  <g transform="translate(485, 860)">
    <rect width="360" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="18" y="28" fill="#1E293B" font-size="14" font-weight="700">Visual Risk Profiles</text>
    <text x="18" y="48" fill="#475569" font-size="12">Risk Band Visualizer</text>
    <text x="18" y="62" fill="#64748B" font-size="11">&bull; Low, Medium, High risk tiers &amp; PD</text>
  </g>

  <!-- Arrow 5B -> 5C -->
  <line x1="845" y1="895" x2="895" y2="895" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />

  <!-- Step 5C -->
  <g transform="translate(910, 860)">
    <rect width="350" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
    <text x="18" y="28" fill="#92400E" font-size="14" font-weight="700">Interactive SHAP Waterfall</text>
    <text x="18" y="48" fill="#B45309" font-size="12" font-weight="700">Waterfall Chart per Prediction</text>
    <text x="18" y="62" fill="#78350F" font-size="11">&bull; Transparent top drivers per applicant</text>
  </g>

</svg>
